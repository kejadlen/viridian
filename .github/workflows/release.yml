name: Release

on:
  # CI calls this after its checks pass on main.
  workflow_call:
  workflow_dispatch:

permissions: {}

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      # One job stamps the time so every matrix build agrees on it.
      - name: Calculate version
        id: version
        run: echo "version=$(date -u +%Y-%m-%d-%H%M)+${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    strategy:
      matrix:
        include:
          - target: aarch64-apple-darwin
            runs-on: macos-latest
          # musl links statically, so the binary doesn't depend on the runner's glibc.
          - target: x86_64-unknown-linux-musl
            runs-on: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            runs-on: ubuntu-24.04-arm
    runs-on: ${{ matrix.runs-on }}
    permissions:
      contents: read # checkout.
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      # jj-lib pulls in psm, which compiles assembly with cc.
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends musl-tools
      - name: Build
        run: |
          rustup target add "${TARGET}"
          cargo build --release --locked -p viri --target "${TARGET}"
          tar -czf "viri-${TARGET}.tar.gz" -C "target/${TARGET}/release" viri
        env:
          TARGET: ${{ matrix.target }}
          VIRI_VERSION: ${{ needs.version.outputs.version }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: viri-${{ matrix.target }}
          path: viri-${{ matrix.target }}.tar.gz
          if-no-files-found: error

  publish:
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release.
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: viri-*
          merge-multiple: true
      - name: Publish
        run: |
          gh release create "v${VERSION}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "v${VERSION}" \
            --generate-notes \
            --target "${GITHUB_SHA}" \
            viri-*.tar.gz
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}

  dotslash:
    needs: [version, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write # upload release assets.
    steps:
      # No checkout: the action reads its config through the API.
      - uses: facebook/dotslash-publish-release@9c9ec027515c34db9282a09a25a9cab5880b2c52 # v2
        with:
          config: .github/dotslash-config.json
          tag: v${{ needs.version.outputs.version }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
