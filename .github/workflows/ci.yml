name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  zizmor:
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout.
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          inputs: .github
          advanced-security: false
          annotations: true

  checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout.
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # bin/coverage gates with bc.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends bc
      - run: rustup component add clippy rustfmt llvm-tools
      - run: cargo install --locked grcov just
      - run: cargo fmt --all --check
      - run: just clippy
      - run: just test
      - run: just coverage
        env:
          VIRI_COVERAGE_JOBS: "4"

  mutants:
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout.
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo install --locked cargo-mutants just
      - run: just mutants

  release:
    needs: [zizmor, checks, mutants]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write # create the release.
    uses: $/.github/workflows/release.yml
