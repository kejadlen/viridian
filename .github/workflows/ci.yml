name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  zizmor:
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout.
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          inputs: .github
          advanced-security: false
          annotations: true

  checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout.
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
      # .cargo/config.toml links with lld; bin/coverage gates with bc.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends lld bc
      - run: rustup component add clippy rustfmt llvm-tools
      - run: cargo install --locked grcov just
      - run: cargo fmt --all --check
      - run: just clippy
      - run: just test
      - run: just coverage
        env:
          VIRI_COVERAGE_JOBS: "4"

  mutants:
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout.
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
      # .cargo/config.toml links with lld.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends lld
      - run: cargo install --locked cargo-mutants just
      - run: just mutants
